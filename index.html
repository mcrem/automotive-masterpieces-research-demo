<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automotive Masterpieces — Research Review</title>
<style>
  :root{
    --bg:#faf9f6;
    --ink:#17181a;
    --ink-soft:#5c5e63;
    --line:#e5e2da;
    --accent:#9a3c1e;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;padding:0 28px;text-align:center;}
  .kicker{
    font-family:var(--sans);
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.72rem;
    font-weight:600;
    color:var(--accent);
    margin:0 0 18px;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.8rem,5vw,2.6rem);
    line-height:1.15;
    margin:0 0 20px;
  }
  p{
    color:var(--ink-soft);
    line-height:1.6;
    font-size:1.02rem;
    margin:0;
  }
  .line{width:48px;height:1px;background:var(--line);margin:28px auto;}
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Research Dossier</p>
    <h1>Automotive Masterpieces<br>Research Review</h1>
    <div class="line"></div>
    <p>La revisione completa del caso è in preparazione.</p>
  </div>
</body>
</html>
